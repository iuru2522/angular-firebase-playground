<section class="access-card access-card--recovery" aria-labelledby="account-deactivated">
  <p class="access-eyebrow">Account access</p>
  <h1 id="account-deactivated">Your account is deactivated</h1>
  <p>Contact your workspace administrator to request reactivation.</p>
  <button mat-flat-button type="button" (click)="logout()" [disabled]="isSubmitting()">Back to Sign In</button>
  @if (error(); as message) {
    <p class="access-error" role="alert">{{ message }}</p>
  }
</section>
