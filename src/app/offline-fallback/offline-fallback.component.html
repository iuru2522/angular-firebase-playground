<section class="access-card access-card--recovery" aria-labelledby="access-offline">
  <p class="access-eyebrow">Account access</p>
  <h1 id="access-offline">Connection unavailable</h1>
  <p>BugTracker can’t connect right now. Check your internet connection and try again.</p>
  <div class="access-actions">
    <button mat-flat-button type="button" (click)="retry()">Retry</button>
    <a mat-stroked-button routerLink="/">Back to Home</a>
  </div>
</section>
