<section class="access-card" aria-labelledby="access-heading">
  <h1 id="access-heading">Welcome Back</h1>
  <p>Sign in to your BugTracker account.</p>
  <form class="access-form" [formGroup]="signinForm" (ngSubmit)="onSubmit()" [attr.aria-busy]="isSubmitting()">
    @if (error(); as message) {
      <p class="access-error" role="alert">{{ message }}</p>
    }
    <mat-form-field appearance="outline">
      <mat-label>Email Address</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email">

      <mat-error>Enter a valid email address.</mat-error>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password">

      <button mat-icon-button matSuffix type="button" (click)="showPassword.update(toggleVisibility)"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
        <mat-icon aria-hidden="true">{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error>Use at least 6 characters.</mat-error>
    </mat-form-field>
    <button mat-flat-button type="submit" [disabled]="isSubmitting() || !!successMessage()">{{ isSubmitting() ? 'Signing in…' : 'Sign In' }}</button>
    <button mat-stroked-button type="button" (click)="onGoogleSignIn()" [disabled]="isSubmitting() || !!successMessage()">Continue with Google</button>
  </form>
  <div class="access-links">
    <a routerLink="/forgot-password">Forgot your password?</a>
    <p>Don’t have an account? <a routerLink="/register">Sign up here</a></p>
  </div>
  @if (successMessage(); as message) {
    <p role="status">{{ message }}</p>
  }
</section>
